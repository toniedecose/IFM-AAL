<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimator - Kalkulator Estimasi</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .back-btn:hover {
            background-color: var(--bg-color);
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .estimator-card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button.submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #eef2ff;
            border-radius: 0.375rem;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="brand">Aplikasi Estimator</a>
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Kembali ke Halaman Utama
        </a>
    </header>

    <main>
        <div class="estimator-card">
            <h1>Kalkulator Estimasi Biaya</h1>
            <form id="estimatorForm" onsubmit="event.preventDefault(); calculateEstimation();">
                <div class="form-group">
                    <label for="serviceType">Pilih Layanan</label>
                    <select id="serviceType" required>
                        <option value="">-- Pilih Layanan --</option>
                        <option value="100000">Paket Basic (Rp 100.000)</option>
                        <option value="250000">Paket Pro (Rp 250.000)</option>
                        <option value="500000">Paket Enterprise (Rp 500.000)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="duration">Durasi (Bulan)</label>
                    <input type="number" id="duration" min="1" value="1" required>
                </div>
                <button type="submit" class="submit-btn">Hitung Estimasi</button>
            </form>
            <div id="resultContainer" class="result" style="display: none;">
                Total Estimasi: <span id="totalPrice">Rp 0</span>
            </div>
        </div>
    </main>

    <script>
        function calculateEstimation() {
            const servicePrice = parseInt(document.getElementById('serviceType').value) || 0;
            const duration = parseInt(document.getElementById('duration').value) || 1;
            const total = servicePrice * duration;
            
            const totalPriceEl = document.getElementById('totalPrice');
            totalPriceEl.textContent = 'Rp ' + total.toLocaleString('id-ID');
            
            document.getElementById('resultContainer').style.display = 'block';
        }
    </script>
</body>
</html>
