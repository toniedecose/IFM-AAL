<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1118;color:#f4f7fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .container{width:min(520px,100%);text-align:center}
    .logo{width:110px;height:110px;object-fit:contain;margin-bottom:34px}
    .code{font-size:clamp(76px,18vw,130px);line-height:.9;font-weight:800;letter-spacing:-6px;color:#d9a441;margin-bottom:22px}
    h1{font-size:clamp(24px,5vw,34px);font-weight:700;margin-bottom:12px}
    p{color:#9aa7b5;font-size:16px;line-height:1.7;margin:0 auto 30px;max-width:420px}
    .home-btn{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:13px 24px;border-radius:8px;background:#d9a441;color:#10161d;text-decoration:none;font-size:14px;font-weight:700;transition:transform .2s ease,opacity .2s ease}
    .home-btn:hover{transform:translateY(-2px);opacity:.9}
    @media(max-width:480px){.logo{width:90px;height:90px;margin-bottom:28px}.code{letter-spacing:-4px}}
  </style>
</head>
<body>
  <main class="container">
    <img src="logo.png" alt="Infrastructure Management AAL" class="logo">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn't exist or may have been moved.</p>
    <a href="index.html" class="home-btn">Back to Home</a>
  </main>
</body>
</html>
