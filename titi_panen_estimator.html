    <script type="text/babel">

        // --- REGIONAL LOCATION & MARKET PRICE DATABASE ---
        const REGIONAL_DATABASE = {

            "Kalimantan": {

                },
                "Kalimantan Tengah": {
                    "Kotawaringin Barat": { cement: 92000, sand: 220000, gravel: 290000, rebar6: 56000, rebar8: 82000, rebar10: 122000, rebar12: 172000, bindingWire: 29000, formworkWood: 2200000, labourWorker: 140000, labourArtisan: 180000, labourForeman: 215000 },
                    "Kotawaringin Timur": { cement: 90000, sand: 215000, gravel: 285000, rebar6: 55000, rebar8: 80000, rebar10: 120000, rebar12: 170000, bindingWire: 28500, formworkWood: 2150000, labourWorker: 138000, labourArtisan: 178000, labourForeman: 212000 }
                },
                "Kalimantan Timur": {
                    "Kutai Timur": { cement: 95000, sand: 230000, gravel: 300000, rebar6: 58000, rebar8: 85000, rebar10: 125000, rebar12: 175000, bindingWire: 30000, formworkWood: 2250000, labourWorker: 145000, labourArtisan: 185000, labourForeman: 220000 },
                    "Paser": { cement: 91000, sand: 220000, gravel: 290000, rebar6: 56000, rebar8: 82000, rebar10: 121000, rebar12: 171000, bindingWire: 29000, formworkWood: 2180000, labourWorker: 140000, labourArtisan: 180000, labourForeman: 215000 }
                }
            },
            "Sulawesi": {
                "Sulawesi Tengah": {
                    "Morowali": { cement: 96000, sand: 235000, gravel: 310000, rebar6: 59000, rebar8: 86000, rebar10: 128000, rebar12: 178000, bindingWire: 31000, formworkWood: 2300000, labourWorker: 150000, labourArtisan: 190000, labourForeman: 225000 }
                },
                "Sulawesi Barat": {
                    "Mamuju": { cement: 89000, sand: 210000, gravel: 280000, rebar6: 54000, rebar8: 79000, rebar10: 118000, rebar12: 167000, bindingWire: 28000, formworkWood: 2100000, labourWorker: 135000, labourArtisan: 175000, labourForeman: 210000 }
                },
                "Sulawesi Selatan": {
                    "Luwu Utara": { cement: 87000, sand: 200000, gravel: 270000, rebar6: 52000, rebar8: 77000, rebar10: 115000, rebar12: 163000, bindingWire: 27000, formworkWood: 2050000, labourWorker: 130000, labourArtisan: 170000, labourForeman: 205000 }
                }
            }
        };

        // --- DEFAULT PROJECT DATA ---
        const DEFAULT_PROJECT = {
            company: "PT Ekadura Indonesia",
            estate: "PT Ekadura Indonesia",
            afdeling: "OE",
            block: "14",
            seniorEstimator: "Ir. Muhamad Fatoni, S.T., M.M.",
            date: new Date().toISOString().split('T')[0],
            island: "Sumatera",
            province: "Riau",
            regency: "Rokan Hulu"
        };

        // --- SPECIFICATIONS DATA FROM TP-01, TP-02, TP-03 ---
        const TITI_PANEN_TYPES = {
            TP01: {
                code: "TP-01",
                name: "Type 1 - Rectangular Slab",
                spans: [3, 4, 5],
                defaultSpan: 4,
                sectionType: "RECTANGULAR",
                width: 300, // mm
                height: 135, // mm
                concreteGrade: "K-300 (Beton Campuran 2:3:5)",
                mainRebar: { dia: 10, count: 4, label: "4 - Ø10mm" },
                stirrupRebar: { dia: 6, spacing: 200, label: "Ø6mm-200" },
                pdfRef: "001/IFM/SPN/TPA/04/2022",
                description: "Struktur pelat datar persegi panjang untuk bentang pendek 3m - 5m."
            },
            TP02: {
                code: "TP-02",
                name: "Type 2 - T-Beam Flanged Section",
                spans: [6, 7, 8, 9],
                defaultSpan: 7,
                sectionType: "T_BEAM",
                width: 300, // mm (Total Flange Width)
                flangeThickness: 100, // mm
                webWidth: 160, // mm
                webHeight: 150, // mm (Depth below flange)
                totalHeight: 250, // mm
                flangeOverhang: 70, // mm each side
                concreteGrade: "K-300 (Beton Campuran 2:3:5)",
                mainRebar: { dia: 10, count: 4, label: "4 - Ø10mm" },
                stirrupRebar: { dia: 6, spacing: 200, label: "Ø6mm-200" },
                pdfRef: "002/IFM/SPN/TPA/04/2022",
                description: "Struktur balok-T efisien untuk bentang menengah 6m - 9m."
            },
            TP03: {
                code: "TP-03",
                name: "Type 3 - Heavy T-Beam Section",
                spans: [10, 11, 12],
                defaultSpan: 10,
                sectionType: "T_BEAM",
                width: 400, // mm (Total Flange Width)
                flangeThickness: 100, // mm
                webWidth: 160, // mm
                webHeight: 200, // mm (Depth below flange)
                totalHeight: 300, // mm
                flangeOverhang: 120, // mm each side
                concreteGrade: "K-300 (Beton Campuran 2:3:5)",
                mainRebar: { dia: 12, count: 6, label: "6 - Ø12mm" },
                stirrupRebar: { dia: 8, spacing: 150, label: "Ø8mm-150" },
                pdfRef: "003/IFM/SPN/TPA/04/2022",
                description: "Struktur balok-T bertulang diperkuat untuk bentang panjang 10m - 12m."
            }
        };


        // 1. GEOMETRY ENGINE
        const GeometryEngine = {
            calculateArea(typeKey) {
                const spec = TITI_PANEN_TYPES[typeKey];
                if (spec.sectionType === "RECTANGULAR") {
                    return (spec.width / 1000) * (spec.height / 1000); // m2
                } else if (spec.sectionType === "T_BEAM") {
                    const flangeArea = (spec.width / 1000) * (spec.flangeThickness / 1000);
                    const webArea = (spec.webWidth / 1000) * (spec.webHeight / 1000);
                    return flangeArea + webArea; // m2
                }
                return 0;
            },
            calculateConcreteVolume(typeKey, spanLength, quantity = 1) {
                const area = this.calculateArea(typeKey);
                return area * spanLength * quantity; // m3
            },
            calculateFormworkArea(typeKey, spanLength, quantity = 1) {
                const spec = TITI_PANEN_TYPES[typeKey];
                let perimeter = 0;
                if (spec.sectionType === "RECTANGULAR") {
                    perimeter = (spec.width / 1000) + 2 * (spec.height / 1000);
                } else {
                    const flangeSoffit = 2 * (spec.flangeOverhang / 1000);
                    const webSoffit = spec.webWidth / 1000;
                    const webSides = 2 * (spec.webHeight / 1000);
                    const flangeSides = 2 * (spec.flangeThickness / 1000);
                    perimeter = flangeSoffit + webSoffit + webSides + flangeSides;
                }
                return perimeter * spanLength * quantity; // m2
            }
        };

        // 2. REBAR ENGINE
        const RebarEngine = {
            getUnitWeight(diameterMm) {
                return 0.006165 * Math.pow(diameterMm, 2);
            },
            calculateRebarDetails(typeKey, spanLength, quantity = 1) {
                const spec = TITI_PANEN_TYPES[typeKey];
                
                const mainDia = spec.mainRebar.dia;
                const mainCount = spec.mainRebar.count;
                const mainBarWeightPerM = this.getUnitWeight(mainDia);
                const hookLength = (2 * 15 * mainDia) / 1000; 
                const mainLengthPerBar = spanLength + hookLength;
                const totalMainLength = mainLengthPerBar * mainCount * quantity;
                const mainWeight = totalMainLength * mainBarWeightPerM;

                const stirrupDia = spec.stirrupRebar.dia;
                const spacingM = spec.stirrupRebar.spacing / 1000;
                const stirrupCountPerUnit = Math.floor(spanLength / spacingM) + 1;
                const totalStirrups = stirrupCountPerUnit * quantity;

                let stirrupCutLength = 0;
                if (spec.sectionType === "RECTANGULAR") {
                    stirrupCutLength = (spec.width - 40 + 100) / 1000; 
                } else {
                    const webW = spec.webWidth - 40;
                    const totalH = spec.totalHeight - 40;
                    const flangeWings = 2 * (spec.flangeOverhang - 20);
                    stirrupCutLength = (2 * webW + 2 * totalH + flangeWings + 100) / 1000;
                }

                const stirrupWeightPerM = this.getUnitWeight(stirrupDia);
                const totalStirrupLength = stirrupCutLength * totalStirrups;
                const stirrupWeight = totalStirrupLength * stirrupWeightPerM;

                const subtotalWeight = mainWeight + stirrupWeight;
                const totalWeightWithWaste = subtotalWeight * 1.05;
                const bindingWireKg = totalWeightWithWaste * 0.015;

                return {
                    mainDia,
                    mainCount,
                    totalMainLength,
                    mainWeight,
                    stirrupDia,
                    totalStirrups,
                    totalStirrupLength,
                    stirrupWeight,
                    subtotalWeight,
                    totalWeightWithWaste,
                    bindingWireKg
                };
            }
        };

        // 3. CONCRETE ENGINE
        const ConcreteEngine = {
            calculateMixComponents(concreteVolumeM3) {
                return {
                    cementKg: concreteVolumeM3 * 380,
                    cementBags: Math.ceil((concreteVolumeM3 * 380) / 50),
                    sandM3: concreteVolumeM3 * 0.52,
                    gravelM3: concreteVolumeM3 * 0.75,
                    waterLiters: concreteVolumeM3 * 215
                };
            }
        };

        // 4. AHSP & PRICE ENGINE
        const AHSPEngine = {
            calculateRAB(typeKey, spanLength, quantity, prices, settings) {
                const concreteVol = GeometryEngine.calculateConcreteVolume(typeKey, spanLength, quantity);
                const formworkArea = GeometryEngine.calculateFormworkArea(typeKey, spanLength, quantity);
                const rebarDetails = RebarEngine.calculateRebarDetails(typeKey, spanLength, quantity);
                const mix = ConcreteEngine.calculateMixComponents(concreteVol);

                const costCement = mix.cementBags * prices.cement;
                const costSand = mix.sandM3 * prices.sand;
                const costGravel = mix.gravelM3 * prices.gravel;
                
                const mainBarPricePerKg = (prices[`rebar${rebarDetails.mainDia}`] || 108000) / (RebarEngine.getUnitWeight(rebarDetails.mainDia) * 12);
                const costRebarMain = rebarDetails.mainWeight * mainBarPricePerKg;

                const stirrupBarPricePerKg = (prices[`rebar${rebarDetails.stirrupDia}`] || 48000) / (RebarEngine.getUnitWeight(rebarDetails.stirrupDia) * 12);
                const costRebarStirrup = rebarDetails.stirrupWeight * stirrupBarPricePerKg;

                const costWire = rebarDetails.bindingWireKg * prices.bindingWire;
                const woodVolM3 = formworkArea * 0.035;
                const costFormworkWood = woodVolM3 * prices.formworkWood;

                const totalMaterialCost = costCement + costSand + costGravel + costRebarMain + costRebarStirrup + costWire + costFormworkWood;

                const totalWorkerOH = (1.6 * concreteVol) + (0.07 * rebarDetails.totalWeightWithWaste) + (0.52 * formworkArea);
                const totalArtisanOH = (0.25 * concreteVol) + (0.07 * rebarDetails.totalWeightWithWaste) + (0.26 * formworkArea);
                const totalForemanOH = (0.08 * concreteVol) + (0.004 * rebarDetails.totalWeightWithWaste) + (0.026 * formworkArea);

                const costWorker = totalWorkerOH * prices.labourWorker;
                const costArtisan = totalArtisanOH * prices.labourArtisan;
                const costForeman = totalForemanOH * prices.labourForeman;

                const totalLabourCost = costWorker + costArtisan + costForeman;
                const subtotalDirect = totalMaterialCost + totalLabourCost;

                const overheadVal = subtotalDirect * (settings.overheadPct / 100);
                const profitVal = subtotalDirect * (settings.profitPct / 100);
                const subtotalBeforeTax = subtotalDirect + overheadVal + profitVal;

                const pphVal = subtotalBeforeTax * (settings.pphPct / 100);
                const ppnVal = subtotalBeforeTax * (settings.ppnPct / 100);

                const grandTotal = subtotalBeforeTax + pphVal + ppnVal;
                const costPerUnit = grandTotal / quantity;
                const costPerMeter = grandTotal / (spanLength * quantity);

                const estimatedDays = Math.ceil((totalWorkerOH + totalArtisanOH) / 5);

                return {
                    concreteVol,
                    formworkArea,
                    rebarDetails,
                    mix,
                    labour: { totalWorkerOH, totalArtisanOH, totalForemanOH, costWorker, costArtisan, costForeman },
                    costs: {
                        cement: costCement,
                        sand: costSand,
                        gravel: costGravel,
                        rebarMain: costRebarMain,
                        rebarStirrup: costRebarStirrup,
                        wire: costWire,
                        formworkWood: costFormworkWood,
                        totalMaterialCost,
                        totalLabourCost,
                        subtotalDirect,
                        overheadVal,
                        profitVal,
                        subtotalBeforeTax,
                        pphVal,
                        ppnVal,
                        grandTotal,
                        costPerUnit,
                        costPerMeter
                    },
                    estimatedDays
                };
            }
        };


        // --- EXPORT WORKBOOK EXCEL ENGINE ---
        const ExportExcelEngine = {
            exportWorkbook(project, typeKey, spanLength, quantity, rab, prices, rabSettings) {
                if (!window.XLSX) {
                    alert("Library XLSX belum dimuat. Silakan periksa koneksi internet.");
                    return;
                }
                const spec = TITI_PANEN_TYPES[typeKey];
                const wb = XLSX.utils.book_new();

                // 1. Sheet Rekapitulasi RAB
                const sheet1Data = [
                    ["REKAPITULASI RENCANA ANGGARAN BIAYA (RAB) TITI PANEN BETON BERTULANG"],
                    ["Astra Agro Lestari - Civil Engineering Standard"],
                    [],
                    ["Informasi Proyek:"],
                    ["Perusahaan / PT", project.company, "Pulau", project.island],
                    ["Kebun / Rayon", project.estate, "Provinsi", project.province],
                    ["Afdeling / Blok", `${project.afdeling} / ${project.block}`, "Kabupaten", project.regency],
                    ["Senior Estimator", project.seniorEstimator, "Tanggal", project.date],
                    [],
                    ["Spesifikasi Titi Panen:"],
                    ["Kode Titi Panen", spec.code, "Panjang Bentang", `${spanLength} Meter`],
                    ["Tipe Struktur", spec.name, "Jumlah Unit", `${quantity} Unit`],
                    ["Mutu Beton", spec.concreteGrade, "Ref. Gambar", spec.pdfRef],
                    [],
                    ["No", "Uraian Biaya Pekerjaan", "Jumlah (Rp)", "Persentase (%)"],
                    [1, "Direct Cost - Pengadaan Material", rab.costs.totalMaterialCost, ((rab.costs.totalMaterialCost / rab.costs.subtotalDirect) * 100).toFixed(2) + "%"],
                    [2, "Direct Cost - Upah Tenaga Kerja AHSP", rab.costs.totalLabourCost, ((rab.costs.totalLabourCost / rab.costs.subtotalDirect) * 100).toFixed(2) + "%"],
                    ["", "SUBTOTAL DIRECT COST", rab.costs.subtotalDirect, "100.00%"],
                    [3, `Overhead (${rabSettings.overheadPct}%)`, rab.costs.overheadVal, ""],
                    [4, `Keuntungan Kontraktor (${rabSettings.profitPct}%)`, rab.costs.profitVal, ""],
                    ["", "SUBTOTAL SEBELUM PAJAK", rab.costs.subtotalBeforeTax, ""],
                    [5, `PPh 21 (${rabSettings.pphPct}%)`, rab.costs.pphVal, ""],
                    [6, `PPN (${rabSettings.ppnPct}%)`, rab.costs.ppnVal, ""],
                    ["", "GRAND TOTAL RAB ESTIMASI", rab.costs.grandTotal, ""],
                    [],
                    ["Analisa Biaya Satuan:"],
                    ["Biaya Per Unit Titi Panen", rab.costs.costPerUnit],
                    ["Biaya Per Meter Panjang", rab.costs.costPerMeter],
                    ["Estimasi Durasi Pengerjaan", `${rab.estimatedDays} Hari Kerja`]
                ];
                const ws1 = XLSX.utils.aoa_to_sheet(sheet1Data);
                ws1['!cols'] = [{ wch: 6 }, { wch: 42 }, { wch: 22 }, { wch: 18 }];
                XLSX.utils.book_append_sheet(wb, ws1, "Rekapitulasi RAB");

                // 2. Sheet Bill of Quantities (BoQ) & Material Take-Off
                const sheet2Data = [
                    ["BILL OF QUANTITIES (BoQ) & RINCIAN MATERIAL"],
                    ["Titi Panen: " + spec.code + " (" + spanLength + "m x " + quantity + " Unit)"],
                    [],
                    ["Kategori", "Item / Material", "Volume Kebutuhan", "Satuan", "Harga Satuan (Rp)", "Total Biaya (Rp)"],
                    ["Material", "Semen Portland PCC (50kg)", rab.mix.cementBags, "Sak", prices.cement, rab.costs.cement],
                    ["Material", "Pasir Beton Cor", rab.mix.sandM3.toFixed(2), "m³", prices.sand, rab.costs.sand],
                    ["Material", "Kerikil / Batu Pecah 2/3", rab.mix.gravelM3.toFixed(2), "m³", prices.gravel, rab.costs.gravel],
                    ["Material", `Besi Beton Utama Ø${rab.rebarDetails.mainDia}mm`, rab.rebarDetails.mainWeight.toFixed(2), "Kg", ((prices[`rebar${rab.rebarDetails.mainDia}`] || 108000) / (RebarEngine.getUnitWeight(rab.rebarDetails.mainDia) * 12)).toFixed(0), rab.costs.rebarMain],
                    ["Material", `Besi Sengkang Ø${rab.rebarDetails.stirrupDia}mm`, rab.rebarDetails.stirrupWeight.toFixed(2), "Kg", ((prices[`rebar${rab.rebarDetails.stirrupDia}`] || 48000) / (RebarEngine.getUnitWeight(rab.rebarDetails.stirrupDia) * 12)).toFixed(0), rab.costs.rebarStirrup],
                    ["Material", "Kawat Bendrat Tali Besi", rab.rebarDetails.bindingWireKg.toFixed(2), "Kg", prices.bindingWire, rab.costs.wire],
                    ["Material", "Kayu Bekisting", (rab.formworkArea * 0.035).toFixed(3), "m³", prices.formworkWood, rab.costs.formworkWood],
                    ["Upah", "Pekerja Lapangan", rab.labour.totalWorkerOH.toFixed(2), "OH", prices.labourWorker, rab.labour.costWorker],
                    ["Upah", "Tukang Batu/Besi", rab.labour.totalArtisanOH.toFixed(2), "OH", prices.labourArtisan, rab.labour.costArtisan],
                    ["Upah", "Mandor Lapangan", rab.labour.totalForemanOH.toFixed(2), "OH", prices.labourForeman, rab.labour.costForeman],
                    [],
                    ["TOTAL DIRECT COST", "", "", "", "", rab.costs.subtotalDirect]
                ];
                const ws2 = XLSX.utils.aoa_to_sheet(sheet2Data);
                ws2['!cols'] = [{ wch: 12 }, { wch: 32 }, { wch: 18 }, { wch: 10 }, { wch: 20 }, { wch: 22 }];

                // its REAL position, and just temporarily strip every
                // height/overflow/position constraint that would otherwise
                // clip it - then put everything back exactly as it was.
                const saved = [

                    [original, 'overflow', original.style.overflow],
                    [overlay, 'position', overlay.style.position],

                    [overlay, 'backdropFilter', overlay.style.backdropFilter],
                    [overlay, 'padding', overlay.style.padding],
                    [card, 'overflow', card.style.overflow],
                ];

                original.style.overflow = 'visible';

        const App = () => {
            const [darkMode, setDarkMode] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('dashboard'); 

            // Project State
            const [project, setProject] = React.useState(DEFAULT_PROJECT);
            const [selectedType, setSelectedType] = React.useState('TP01');
            const [selectedSpan, setSelectedSpan] = React.useState(4);
            const [quantity, setQuantity] = React.useState(1);

            // =====================================================
            // CENTRAL ESTIMATOR DATABASE - GOOGLE APPS SCRIPT
            // =====================================================
            const ESTIMATOR_API_URL = 'https://script.google.com/macros/s/AKfycbz-HlgiUnb9m9xXHOiC7fW9fN5cZPOWLMOCQ0ogSk_nKO1Qgw78k9D5dmiRg8oGbf-g/exec';
            const ESTIMATOR_NAME = 'Titi Panen';
            const [centralLocations, setCentralLocations] = React.useState(null);
            const [priceLoading, setPriceLoading] = React.useState(false);
            const [priceSource, setPriceSource] = React.useState('LOCAL');

            // Dynamic Regional Price Database with LocalStorage persistence
            const [regionalDb, setRegionalDb] = React.useState(() => {
                const saved = localStorage.getItem('titi_panen_regional_db');
                return saved ? JSON.parse(saved) : REGIONAL_DATABASE;
            });

            // Prices for active selected regency
            const [prices, setPrices] = React.useState(() => {
                return regionalDb["Sumatera"]["Riau"]["Rokan Hulu"];
            });

            const [rabSettings, setRabSettings] = React.useState({
                overheadPct: 5.0,
                profitPct: 10.0,
                pphPct: 4.0,
                ppnPct: 0.0
            });

            const [wizardStep, setWizardStep] = React.useState(1);
            const [isReportOpen, setIsReportOpen] = React.useState(false);

            const [history, setHistory] = React.useState(() => {
                const saved = localStorage.getItem('titi_panen_estimations');
                return saved ? JSON.parse(saved) : [];
            });

            const [explainData, setExplainData] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // =====================================================
            // CENTRAL DATABASE HELPERS
            // =====================================================

            const fetchCentralPrices = async (province, regency) => {
                if (!province || !regency) return null;

                setPriceLoading(true);

                try {
                    const url = ESTIMATOR_API_URL
                        + '?action=estimatorprices'
                        + '&estimator=' + encodeURIComponent(ESTIMATOR_NAME)
                        + '&province=' + encodeURIComponent(province)
                        + '&regency=' + encodeURIComponent(regency);

                    const response = await fetch(url, {
                        method: 'GET',
                        cache: 'no-store'
                    });

                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }

                    const data = await response.json();

                    if (!data.success || !data.prices || !data.count) {
                        throw new Error(data.error || 'Harga pusat tidak ditemukan.');
                    }

                    const mapped = {};
                    Object.entries(data.prices).forEach(([item, value]) => {
                        mapped[item] = Number(value.price) || 0;
                    });

                    setPrices(prev => ({ ...prev, ...mapped }));
                    setPriceSource('CENTRAL DATABASE');

                    return mapped;
                } catch (error) {
                    console.error('Central estimator database error:', error);
                    setPriceSource('LOCAL FALLBACK');
                    showToast('Harga pusat tidak dapat diambil. Menggunakan harga lokal sementara.', 'error');
                    return null;
                } finally {
                    setPriceLoading(false);
                }
            };

            const loadCentralLocations = async () => {
                try {
                    const url = ESTIMATOR_API_URL + '?action=estimatorlocations&estimator=' + encodeURIComponent(ESTIMATOR_NAME);
                    const response = await fetch(url, { method: 'GET', cache: 'no-store' });
                    if (!response.ok) throw new Error('HTTP ' + response.status);

                    const data = await response.json();
                    if (!data.success || !Array.isArray(data.locations)) {
                        throw new Error(data.error || 'Lokasi pusat tidak tersedia.');
                    }

                    setCentralLocations(data.locations);

                    // Pilih lokasi pertama yang tersedia bila lokasi default belum ada.
                    const islands = [...new Set(data.locations.map(x => x.island).filter(Boolean))];
                    const currentIsland = data.locations.some(x => x.island === project.island)
                        ? project.island : (islands[0] || project.island);
                    const provinces = data.locations.filter(x => x.island === currentIsland);
                    const currentProvince = provinces.some(x => x.province === project.province)
                        ? project.province : (provinces[0]?.province || project.province);
                    const regencies = provinces.filter(x => x.province === currentProvince);
                    const currentRegency = regencies.some(x => x.regency === project.regency)
                        ? project.regency : (regencies[0]?.regency || project.regency);

                    setProject(prev => ({
                        ...prev,
                        island: currentIsland,
                        province: currentProvince,
                        regency: currentRegency
                    }));

                    await fetchCentralPrices(currentProvince, currentRegency);
                } catch (error) {
                    console.warn('Central location database unavailable:', error);
                    setPriceSource('LOCAL FALLBACK');
                }
            };

            // Load central location database once when the page starts.
            React.useEffect(() => {
                loadCentralLocations();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // Update project location and prices when Location changes.
            const handleLocationChange = async (newIsland, newProvince, newRegency) => {
                const locations = centralLocations;

                if (locations && locations.length) {
                    let updatedIsland = newIsland || project.island;
                    let provinceRows = locations.filter(x => x.island === updatedIsland);
                    let updatedProvince = newProvince || (provinceRows.some(x => x.province === project.province) ? project.province : provinceRows[0]?.province);
                    let regencyRows = provinceRows.filter(x => x.province === updatedProvince);
                    let updatedRegency = newRegency || (regencyRows.some(x => x.regency === project.regency) ? project.regency : regencyRows[0]?.regency);

                    setProject(prev => ({
                        ...prev,
                        island: updatedIsland,
                        province: updatedProvince || '',
                        regency: updatedRegency || ''
                    }));

                    if (updatedProvince && updatedRegency) {
                        await fetchCentralPrices(updatedProvince, updatedRegency);
                    }
                    return;
                }

                // Fallback ke database lama jika API belum tersedia.
                let updatedIsland = newIsland || project.island;
                let availableProvinces = Object.keys(regionalDb[updatedIsland] || {});
                let updatedProvince = newProvince || (availableProvinces.includes(project.province) ? project.province : availableProvinces[0]);
                let availableRegencies = Object.keys((regionalDb[updatedIsland] && regionalDb[updatedIsland][updatedProvince]) || {});
                let updatedRegency = newRegency || (availableRegencies.includes(project.regency) ? project.regency : availableRegencies[0]);

                setProject(prev => ({
                    ...prev,
                    island: updatedIsland,
                    province: updatedProvince,
                    regency: updatedRegency
                }));

                if (regionalDb[updatedIsland]?.[updatedProvince]?.[updatedRegency]) {
                    setPrices(regionalDb[updatedIsland][updatedProvince][updatedRegency]);
                }
            };

            // Refresh harga dari database pusat.
            const handleUpdateMarketPrice = async () => {
                const result = await fetchCentralPrices(project.province, project.regency);
                if (result) {
                    showToast(`Harga pusat ${project.regency} berhasil diperbarui.`);
                }
            };

            const currentRAB = React.useMemo(() => {
                return AHSPEngine.calculateRAB(selectedType, selectedSpan, quantity, prices, rabSettings);
            }, [selectedType, selectedSpan, quantity, prices, rabSettings]);

            const handleSaveEstimation = () => {
                const newRecord = {
                    id: 'EST-' + Date.now(),
                    project: { ...project },
                    typeKey: selectedType,
                    spanLength: selectedSpan,
                    quantity,
                    rab: currentRAB,
                    timestamp: new Date().toLocaleString('id-ID')
                };
                const updated = [newRecord, ...history];
                setHistory(updated);
                localStorage.setItem('titi_panen_estimations', JSON.stringify(updated));
                showToast("Estimasi Titi Panen berhasil disimpan ke Riwayat!");
            };

            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, wizardStep, darkMode, isReportOpen]);

            const triggerExplain = (title, formula, inputs, trace, result) => {
                setExplainData({ title, formula, inputs, trace, result });
            };

            return (
                <div className={`min-h-screen flex flex-col ${darkMode ? 'dark bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    
                    {/* TOP HEADER */}
                    <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-lg bg-emerald-600 flex items-center justify-center font-black text-xl tracking-wider text-white shadow-inner">

                                                        <th className="p-3">ID Estimasi</th>
                                                        <th className="p-3">Waktu</th>
                                                        <th className="p-3">Lokasi / Kabupaten</th>
                                                        <th className="p-3">Tipe Titi Panen</th>
                                                        <th className="p-3">Bentang / Qty</th>
                                                        <th className="p-3">Grand Total</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                                    {history.map(item => (
                                                        <tr key={item.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/50">
                                                            <td className="p-3 font-mono font-bold text-brand-600">{item.id}</td>
                                                            <td className="p-3 text-slate-500">{item.timestamp}</td>
                                                            <td className="p-3 font-semibold">{item.project.regency}</td>
                                                            <td className="p-3 font-bold">{TITI_PANEN_TYPES[item.typeKey].code}</td>
                                                            <td className="p-3">{item.spanLength}m ({item.quantity} Unit)</td>
                                                            <td className="p-3 font-extrabold text-emerald-600 dark:text-emerald-400">
                                                                Rp {item.rab.costs.grandTotal.toLocaleString('id-ID', { maximumFractionDigits: 0 })}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* SETTINGS TAB */}
                            {activeTab === 'settings' && (
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 animate-fade-in">
                                    <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100">Pengaturan Markup & Pajak RAB</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">Overhead (%)</label>
                                            <input type="number" step="0.5" value={rabSettings.overheadPct} onChange={e => setRabSettings({...rabSettings, overheadPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">Keuntungan Kontraktor (%)</label>
                                            <input type="number" step="0.5" value={rabSettings.profitPct} onChange={e => setRabSettings({...rabSettings, profitPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">PPh 21 (%)</label>
                                            <input type="number" step="0.1" value={rabSettings.pphPct} onChange={e => setRabSettings({...rabSettings, pphPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">PPN (%)</label>
                                            <input type="number" step="0.1" value={rabSettings.ppnPct} onChange={e => setRabSettings({...rabSettings, ppnPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-white font-semibold text-xs flex items-center space-x-2 transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4"></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* EXPLAIN CALCULATION MODAL */}
                    <ExplainModal 
                        isOpen={!!explainData} 
                        onClose={() => setExplainData(null)} 
                        topicData={explainData} 
                    />

                    {/* FULL REPORT / PRINT MODAL */}
                    <ReportModal 
                        isOpen={isReportOpen}
                        onClose={() => setIsReportOpen(false)}
                        project={project}
                        selectedType={selectedType}
                        selectedSpan={selectedSpan}
                        quantity={quantity}
                        currentRAB={currentRAB}
                        prices={prices}
                        rabSettings={rabSettings}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
