                                                    value={compareQty}
                                                    onChange={e => setCompareQty(Math.max(1, Number(e.target.value) || 1))}
                                                    className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 font-bold"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 mb-1">Lingkup Perbandingan</label>
                                                <select
                                                    value={compareScope}
                                                    onChange={e => setCompareScope(e.target.value)}
                                                    className="w-full p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 font-bold"
                                                >
                                                    <option value="all">Semua PT</option>
                                                    <option value="province">PT di Provinsi Aktif</option>
                                                    <option value="regency">PT di Kabupaten Aktif</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mt-4">
                                            <div className="text-[11px] text-slate-500">
                                                Lokasi aktif: <b>{project.regency}, {project.province}</b> · Spesifikasi: <b>{TITI_PANEN_TYPES[compareType]?.code}</b> bentang <b>{compareSpan} m</b> · Qty <b>{compareQty}</b>
                                            </div>
                                            <div className="flex gap-2">
                                                <select
                                                    value={compareSort}
                                                    onChange={e => setCompareSort(e.target.value)}
                                                    className="p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-xs font-bold"
                                                >
                                                    <option value="priceAsc">Termurah → Termahal</option>
                                                    <option value="priceDesc">Termahal → Termurah</option>
                                                    <option value="pt">Urut PT</option>
                                                </select>
                                                <button
                                                    onClick={runPTComparison}
                                                    disabled={compareLoading}
                                                    className="px-4 py-2 bg-brand-600 hover:bg-brand-500 disabled:opacity-60 text-white rounded-lg text-xs font-bold flex items-center gap-2 shadow"
                                                >
                                                    <i data-lucide={compareLoading ? "loader-2" : "search"} className={`w-4 h-4 ${compareLoading ? "animate-spin" : ""}`}></i>
                                                    {compareLoading ? 'Mengambil Harga...' : 'Bandingkan Sekarang'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {compareRows.length > 0 && (
                                        <div className="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                                            <div className="px-5 py-4 border-b border-slate-200 dark:border-slate-700">
                                                <div className="flex justify-between items-center">
                                                    <div>
                                                        <h3 className="font-extrabold text-sm text-slate-800 dark:text-slate-100">Hasil Perbandingan</h3>
                                                        <p className="text-[11px] text-slate-500">Harga dihitung ulang dengan formula RAB yang sama untuk semua PT.</p>
                                                    </div>
                                                    <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                                                        {sortedCompareRows.filter(r => r.available).length} PT tersedia
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-xs">
                                                    <thead className="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 font-bold uppercase">
                                                        <tr>
                                                            <th className="p-3 text-left">Rank</th>
                                                            <th className="p-3 text-left">PT</th>
                                                            <th className="p-3 text-left">Kabupaten</th>
                                                            <th className="p-3 text-left">IFM Analyst</th>
                                                            <th className="p-3 text-right">Material</th>
                                                            <th className="p-3 text-right">Upah</th>
                                                            <th className="p-3 text-right">Grand Total</th>
                                                            <th className="p-3 text-right">Rp/Unit</th>
                                                            <th className="p-3 text-right">Rp/Meter</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {sortedCompareRows.map((row, idx) => (
                                                            <tr key={row.pt} className="border-t border-slate-100 dark:border-slate-700">
                                                                <td className="p-3 font-extrabold text-slate-400">{row.available ? idx + 1 : '-'}</td>
                                                                <td className="p-3 font-extrabold text-slate-800 dark:text-slate-100">{row.pt}</td>
                                                                <td className="p-3 text-slate-600 dark:text-slate-300">{row.regency}</td>
                                                                <td className="p-3 text-slate-600 dark:text-slate-300">{row.estimator || '-'}</td>
                                                                <td className="p-3 text-right font-mono">{row.available ? 'Rp ' + row.materialCost.toLocaleString('id-ID') : 'Tidak tersedia'}</td>
                                                                <td className="p-3 text-right font-mono">{row.available ? 'Rp ' + row.labourCost.toLocaleString('id-ID') : '-'}</td>
                                                                <td className="p-3 text-right font-black text-emerald-700 dark:text-emerald-400">{row.available ? 'Rp ' + row.grandTotal.toLocaleString('id-ID', {maximumFractionDigits: 0}) : '-'}</td>
                                                                <td className="p-3 text-right font-bold">{row.available ? 'Rp ' + row.costPerUnit.toLocaleString('id-ID', {maximumFractionDigits: 0}) : '-'}</td>
                                                                <td className="p-3 text-right font-bold">{row.available ? 'Rp ' + row.costPerMeter.toLocaleString('id-ID', {maximumFractionDigits: 0}) : '-'}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div className="px-5 py-3 bg-slate-50 dark:bg-slate-900/40 text-[10px] text-slate-500">
                                                Catatan: PT yang berada di Kabupaten yang sama akan memiliki harga material/upah yang sama, karena database harga Anda berada pada level Kabupaten. Perbedaan antar PT muncul jika Kabupaten sumber harganya berbeda.
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* HISTORY TAB */}
                            {activeTab === 'history' && (
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4 animate-fade-in">
                                    <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100">Riwayat Estimasi Tersimpan</h2>
                                    {history.length === 0 ? (
                                        <div className="p-8 text-center text-slate-400 text-xs">
                                            Belum ada riwayat estimasi yang disimpan. Buat estimasi baru dari wizard!
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs">
                                                <thead className="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold uppercase">
                                                    <tr>
                                                        <th className="p-3">ID Estimasi</th>
                                                        <th className="p-3">Waktu</th>
                                                        <th className="p-3">Lokasi / Kabupaten</th>
                                                        <th className="p-3">Tipe Titi Panen</th>
                                                        <th className="p-3">Bentang / Qty</th>
                                                        <th className="p-3">Grand Total</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                                    {history.map(item => (
                                                        <tr key={item.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/50">
                                                            <td className="p-3 font-mono font-bold text-brand-600">{item.id}</td>
                                                            <td className="p-3 text-slate-500">{item.timestamp}</td>
                                                            <td className="p-3 font-semibold">{item.project.regency}</td>
                                                            <td className="p-3 font-bold">{TITI_PANEN_TYPES[item.typeKey].code}</td>
                                                            <td className="p-3">{item.spanLength}m ({item.quantity} Unit)</td>
                                                            <td className="p-3 font-extrabold text-emerald-600 dark:text-emerald-400">
                                                                Rp {item.rab.costs.grandTotal.toLocaleString('id-ID', { maximumFractionDigits: 0 })}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* SETTINGS TAB */}
                            {activeTab === 'settings' && (
                                <div className="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6 animate-fade-in">
                                    <h2 className="text-lg font-extrabold text-slate-800 dark:text-slate-100">Pengaturan Markup & Pajak RAB</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">Overhead (%)</label>
                                            <input type="number" step="0.5" value={rabSettings.overheadPct} onChange={e => setRabSettings({...rabSettings, overheadPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">Keuntungan Kontraktor (%)</label>
                                            <input type="number" step="0.5" value={rabSettings.profitPct} onChange={e => setRabSettings({...rabSettings, profitPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">PPh Final Jasa Konstruksi (%)</label>
                                            <input type="number" step="0.1" value={rabSettings.pphPct} onChange={e => setRabSettings({...rabSettings, pphPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 mb-1 font-semibold">PPN (%)</label>
                                            <input type="number" step="0.1" value={rabSettings.ppnPct} onChange={e => setRabSettings({...rabSettings, ppnPct: Number(e.target.value)})} className="w-full p-2.5 rounded-lg border bg-slate-50 dark:bg-slate-700 border-slate-200 dark:border-slate-600 font-bold" />
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-white font-semibold text-xs flex items-center space-x-2 transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4"></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* EXPLAIN CALCULATION MODAL */}
                    <ExplainModal 
                        isOpen={!!explainData} 
                        onClose={() => setExplainData(null)} 
                        topicData={explainData} 
                    />

                    {/* FULL REPORT / PRINT MODAL */}
                    <ReportModal 
                        isOpen={isReportOpen}
                        onClose={() => setIsReportOpen(false)}
                        project={project}
                        selectedType={selectedType}
                        selectedSpan={selectedSpan}
                        quantity={quantity}
                        currentRAB={currentRAB}
                        prices={prices}
                        rabSettings={rabSettings}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>



</body>
</html>
