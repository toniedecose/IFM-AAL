                webHeight: 225, // mm below flange
                totalHeight: 300, // mm
                flangeOverhang: 175, // mm each side
                concreteGrade: "K-300 (Beton Campuran 2:3:5)",
                mainRebar: { dia: 10, count: 6, label: "6 - Ø10mm + 1 - Ø10mm + 6 - Ø6mm" },
                stirrupRebar: { dia: 6, spacing: 200, label: "Ø6mm-200 lapangan / Ø6mm-100 tumpuan" },
                // Detail tulangan from drawing: a=L-60 mm, b=a/5, c=3a/5.
                longitudinalSchedule: [
                    { dia: 10, count: 6, length: "a", position: "Bawah" },
                    { dia: 6, count: 6, length: "b", position: "Atas flange" },
                    { dia: 10, count: 1, length: "c", position: "Atas" }
                ],
                stirrupSchedule: {
                    supportSpacing: 100,
                    fieldSpacing: 200,
                    supportLengthRatio: 0.25,
                    fieldLengthRatio: 0.50,
                    webU: { dia: 6, width: 105, height: 260, hookAllowance: 100, label: "Ø6 U-web" },
                    topTie: { dia: 6, cutLength: 460, label: "Ø6 top tie" }
                },
                pdfRef: "004/IFM/SPN/TPA/04/2022",
                revision: "03/09/2024",
                description: "Balok-T 500 x 300 mm (flange 75 mm, web 150 mm) untuk bentang 11-12 meter."
            }
        };

        // --- BASIS STANDAR PERHITUNGAN ---
        // Quantity take-off mengikuti drawing Titi Panen AAL TP-01 s.d. TP-04.
        // Cost analysis mengikuti AHSP Permen PUPR No. 8 Tahun 2023.
        // Harga besi pada database ESTIMATOR = Rp/kg (BUKAN Rp/batang).
        const STANDARD_BASIS = {
            ahsp: "Permen PUPR No. 8 Tahun 2023 - AHSP Bidang PUPR",
            concrete: "U.4.2.b.1.2 - Pembuatan s.d. Pengecoran beton fc' 25 MPa secara semi-mekanis",
            rebarSmall: "U.4.6.a.3 - Penulangan kolom/balok/ring balk/sloof BjTP/BjTS < 12 mm secara manual",
            rebarLarge: "U.4.6.a.4 - Penulangan kolom/balok/ring balk/sloof BjTP/BjTS >= 12 mm secara semi-mekanis",
            concreteStructure: "SNI 2847:2019 - Persyaratan beton struktural",
            reinforcementMaterial: "SNI 2052:2024 - Baja tulangan beton",
            roadBridgeExecution: "Spesifikasi Umum Bina Marga 2025 - Seksi 7.1 Beton & 7.3 Baja Tulangan",
            // Berat isi lepas yang dipakai hanya untuk mengonversi HSD pasir/kerikil Rp/m3
            // karena koefisien AHSP beton dinyatakan dalam kg.
            sandLooseDensityKgM3: 1370,
            gravelLooseDensityKgM3: 1260,
            rebarMaterialFactor: 1.02,
            bindingWireFactorPerKgInstalled: 0.028,
            // Bekisting balok: kebijakan estimator maksimal 2 kali pakai untuk menjaga umur material dan
            // menghindari pembongkaran terlalu dini di lapangan. Koefisien material reusable dibatasi maksimal 2 kali pakai; koefisien tenaga kerja tetap per m².
            formwork: {
                reuse: 2,
                worker: 0.660,
                carpenter: 0.330,
                headCarpenter: 0.033,
                foreman: 0.011,
                nailsKgPerM2: 0.400,
                releaseOilLPerM2: 0.200,
                classIIBalokM3PerM2: 0.00837,
                plywoodSheetPerM2: 0.190575,
                dolkenBarPerM2: 0.975
            },
            // AHSP U.4.2.b.1.2 sudah mencakup pembuatan s.d. pengecoran.
            // Jangan menambahkan tenaga pengecoran kedua kali.
            concreteLabour: { worker: 1.000, artisan: 0.250, head: 0.025, foreman: 0.100 },
            // U.4.5.b hanya ditambahkan bila metode pemadatan vibrator dipilih.
            concreteEquipment: { mixerDayPerM3: 0.1475 },
            concreteCompaction: { worker: 0.080, foreman: 0.008, vibratorDay: 0.080 },
            rebarManualSmall: { worker: 0.00160, artisan: 0.00160, head: 0.00016, foreman: 0.00016 },
            rebarManualLarge: { worker: 0.00160, artisan: 0.00160, head: 0.00016, foreman: 0.00016 },
            // Peralatan mengikuti HSD database. Mixer/vibrator berasal dari AHSP beton;
            // cutter/bender hanya aktif untuk tulangan >=12 mm sesuai U.4.6.a.4.
            equipmentPriceKeys: { mixer: 'equipmentMixer', vibrator: 'equipmentVibrator', cutter: 'equipmentBarCutter', bender: 'equipmentBarBender' }
        };

        // --- DRAWING / EXCEL TAKE-OFF BASIS ---
        // Source basis: existing approved take-off rows for TP-01/TP-02;
        // TP-03/TP-04 are calculated from their drawing reinforcement schedules to avoid
        // the previous cross-type mapping error.
        const DRAWING_TAKEOFF = {
            // Approved take-off rows retained for TP-01 / TP-02.
            // TP-02 5–7 m follows the existing RAB take-off basis used as the 6 m benchmark.
            3:  { concreteVol: 0.1215, formworkArea: 1.791, rebar: [{ role: 'main', dia: 10, weight: 7.398 }, { role: 'stirrup', dia: 6, weight: 1.06512 }] },
            4:  { concreteVol: 0.1620, formworkArea: 2.361, rebar: [{ role: 'main', dia: 10, weight: 9.864 }, { role: 'stirrup', dia: 6, weight: 1.39797 }] },
            5:  { concreteVol: 0.2700, formworkArea: 4.108, rebar: [{ role: 'main', dia: 10, weight: 18.495 }, { role: 'stirrup', dia: 6, weight: 6.461728 }] },
            6:  { concreteVol: 0.3240, formworkArea: 4.908, rebar: [{ role: 'main', dia: 10, weight: 22.194 }, { role: 'stirrup', dia: 6, weight: 7.704368 }] },
            7:  { concreteVol: 0.3780, formworkArea: 5.708, rebar: [{ role: 'main', dia: 10, weight: 25.893 }, { role: 'stirrup', dia: 6, weight: 8.947008 }] }
        };

        // Type 3 and Type 4 are calculated directly from their drawing schedules below.
        // Their old hard-coded 10–12 m take-off rows were inconsistent with the drawing
        // diameters and are intentionally not used.
        const getDrawingTakeoff = (typeKey, spanLength) => {
            if (typeKey !== 'TP01' && typeKey !== 'TP02') return null;
            return DRAWING_TAKEOFF[Number(spanLength)] || null;
        };

        // 1. GEOMETRY ENGINE
        const GeometryEngine = {
            calculateArea(typeKey) {
                const spec = TITI_PANEN_TYPES[typeKey];
                if (spec.sectionType === "RECTANGULAR") {
                    return (spec.width / 1000) * (spec.height / 1000);
                }
                if (spec.sectionType === "T_BEAM") {
                    const flangeArea = (spec.width / 1000) * (spec.flangeThickness / 1000);
                    const webArea = (spec.webWidth / 1000) * (spec.webHeight / 1000);
                    return flangeArea + webArea;
                }
                return 0;
            },
            calculateConcreteVolume(typeKey, spanLength, quantity = 1) {
                const takeoff = getDrawingTakeoff(typeKey, spanLength);
                if (takeoff) return takeoff.concreteVol * quantity;
                // Drawing take-off section areas for TP-03 and TP-04 are the rounded design
                // areas used in the existing quantity basis: 0.054 m² and 0.072 m² respectively.
                const sectionArea = typeKey === 'TP03' ? 0.054 : (typeKey === 'TP04' ? 0.072 : this.calculateArea(typeKey));
                return sectionArea * spanLength * quantity;
            },
            calculateFormworkArea(typeKey, spanLength, quantity = 1) {
                const takeoff = getDrawingTakeoff(typeKey, spanLength);
                if (takeoff) return takeoff.formworkArea * quantity;
                const spec = TITI_PANEN_TYPES[typeKey];

                // For TP-03/TP-04, do not reuse the old cross-type hard-code.
                // Formwork is based on the exposed faces of the T-beam:
                // soffit width + both web sides, plus the two end faces.
                // The top face of the flange is not formwork.
                if (typeKey === 'TP03' || typeKey === 'TP04') {
                    const soffitWidth = spec.width / 1000;
                    const webSideHeight = spec.webHeight / 1000;
                    const sectionArea = this.calculateArea(typeKey);
                    const longitudinalFormworkPerM = soffitWidth + (2 * webSideHeight);
                    const endFaceAllowance = 2 * sectionArea;
                    return (longitudinalFormworkPerM * spanLength + endFaceAllowance) * quantity;
                }

                // Retain the approved take-off basis for TP-01/TP-02.
                const formworkWidthFactor = typeKey === 'TP01' ? 0.570 : 0.800;
                const fixedEndAllowance = typeKey === 'TP01' ? 0.081 : 0.108;
                return (formworkWidthFactor * spanLength + fixedEndAllowance) * quantity;
            }
        };

        // 2. REBAR ENGINE
        const RebarEngine = {
            getUnitWeight(diameterMm) {
                // Berat teoritis SNI: w = 0.006165 d^2 kg/m.
                return 0.006165 * Math.pow(diameterMm, 2);
            },
            getBarPricePerKg(diameterMm, prices) {
                // PENTING: database ESTIMATOR sudah Rp/kg.
                return Number(prices[`rebar${diameterMm}`] || 0);
            },
            countStations(lengthM, spacingM) {
                return Math.floor(lengthM / spacingM + 1e-9) + 1;
            },
            calculateDetailedStirrups(spec, spanLength) {
                const schedule = spec.stirrupSchedule;
                const supportLength = spanLength * schedule.supportLengthRatio;
                const fieldLength = spanLength * schedule.fieldLengthRatio;
                const supportStationsEach = this.countStations(supportLength, schedule.supportSpacing / 1000);
                const fieldStations = this.countStations(fieldLength, schedule.fieldSpacing / 1000);
                const totalStations = Math.max(1, (supportStationsEach * 2) + fieldStations - 2);
                const webU = schedule.webU;
                const webUCutLength = (2 * (webU.height / 1000)) + (webU.width / 1000) + (webU.hookAllowance / 1000);
                const topTieCutLength = schedule.topTie.cutLength / 1000;
                const webULength = webUCutLength * totalStations;
                const topTieLength = topTieCutLength * totalStations;
                return {
                    supportLength, fieldLength, supportStationsEach, fieldStations, totalStations,
                    components: [
                        { dia: webU.dia, count: totalStations, cutLength: webUCutLength, totalLength: webULength, weight: webULength * this.getUnitWeight(webU.dia), label: webU.label },
                        { dia: schedule.topTie.dia, count: totalStations, cutLength: topTieCutLength, totalLength: topTieLength, weight: topTieLength * this.getUnitWeight(schedule.topTie.dia), label: schedule.topTie.label }
                    ]
                };
            },
            calculateRebarDetails(typeKey, spanLength, quantity = 1) {
                const spec = TITI_PANEN_TYPES[typeKey];
                const takeoff = getDrawingTakeoff(typeKey, spanLength);

                // TP-03/TP-04 have explicit longitudinal and stirrup schedules in the drawing.
                // Use those schedules directly; never fall back to the generic 4/6-bar formula.
                if (spec.longitudinalSchedule) {
                    const a = Math.max(0, spanLength - 0.06);
                    const b = a / 5;
                    const c = (3 * a) / 5;
                    const lengthMap = { a, b, c };
                    const longitudinalBars = spec.longitudinalSchedule.map(item => {
                        const lengthPerBar = lengthMap[item.length];
                        const totalLength = lengthPerBar * item.count * quantity;
                        return { ...item, lengthPerBar, totalLength, weight: totalLength * this.getUnitWeight(item.dia) };
                    });
                    const detailed = this.calculateDetailedStirrups(spec, spanLength);
                    const stirrupBars = detailed.components.map(item => ({
                        ...item,
                        count: item.count * quantity,
                        totalLength: item.totalLength * quantity,
                        weight: item.weight * quantity
                    }));
                    const mainWeight = longitudinalBars.reduce((sum, bar) => sum + bar.weight, 0);
                    const stirrupWeight = stirrupBars.reduce((sum, bar) => sum + bar.weight, 0);
                    const installedWeight = mainWeight + stirrupWeight;
                    return {
                        mainDia: longitudinalBars[0]?.dia || 0,
                        mainCount: longitudinalBars.reduce((sum, bar) => sum + bar.count, 0),
                        totalMainLength: longitudinalBars.reduce((sum, bar) => sum + bar.totalLength, 0),
                        mainWeight,
                        stirrupDia: stirrupBars[0]?.dia || 0,
                        totalStirrups: detailed.totalStations * quantity,
                        totalStirrupLength: stirrupBars.reduce((sum, bar) => sum + bar.totalLength, 0),
                        stirrupWeight,
                        subtotalWeight: installedWeight,
                        installedWeight,
                        procurementWeight: installedWeight * STANDARD_BASIS.rebarMaterialFactor,
                        bindingWireKg: installedWeight * STANDARD_BASIS.bindingWireFactorPerKgInstalled,
                        longitudinalBars,
                        stirrupBars,
                        longitudinalLabel: longitudinalBars.map(x => `Ø${x.dia} (${x.position})`).join(' + '),
                        stirrupLabel: stirrupBars.map(x => x.label || `Ø${x.dia}`).join(' + ')
                    };
                }

                if (takeoff) {
                    const longitudinalBars = takeoff.rebar.filter(x => x.role === 'main').map(x => ({
                        dia: x.dia,
                        count: 0,
                        lengthPerBar: 0,
                        totalLength: x.weight / this.getUnitWeight(x.dia) * quantity,
                        weight: x.weight * quantity,
                        position: 'Utama',
                        label: `Besi Panjang Ø${x.dia}mm`
                    }));
                    const stirrupBars = takeoff.rebar.filter(x => x.role === 'stirrup').map(x => ({
                        dia: x.dia,
                        count: 0,
                        cutLength: 0,
                        totalLength: x.weight / this.getUnitWeight(x.dia) * quantity,
                        weight: x.weight * quantity,
                        label: `Besi Begel Ø${x.dia}mm`
                    }));
                    const mainWeight = longitudinalBars.reduce((sum, bar) => sum + bar.weight, 0);
                    const stirrupWeight = stirrupBars.reduce((sum, bar) => sum + bar.weight, 0);
                    const installedWeight = mainWeight + stirrupWeight;
                    const procurementWeight = installedWeight * STANDARD_BASIS.rebarMaterialFactor;
                    const bindingWireKg = installedWeight * STANDARD_BASIS.bindingWireFactorPerKgInstalled;
                    return {
                        mainDia: longitudinalBars[0]?.dia || 0,
                        mainCount: 0,
                        totalMainLength: longitudinalBars.reduce((sum, bar) => sum + bar.totalLength, 0),
                        mainWeight,
                        stirrupDia: stirrupBars[0]?.dia || 0,
                        totalStirrups: 0,
                        totalStirrupLength: stirrupBars.reduce((sum, bar) => sum + bar.totalLength, 0),
                        stirrupWeight,
                        subtotalWeight: installedWeight,
                        installedWeight,
                        procurementWeight,
                        bindingWireKg,
                        longitudinalBars,
                        stirrupBars,
                        longitudinalLabel: longitudinalBars.map(x => `Ø${x.dia}`).join(' + '),
                        stirrupLabel: stirrupBars.map(x => `Ø${x.dia}`).join(' + ')
                    };
                }

                // Fallback only for a span that is not present in the drawing take-off.
                const mainDia = spec.mainRebar.dia;
                const mainCount = spec.mainRebar.count;
                const mainLengthPerBar = spanLength + ((2 * 15 * mainDia) / 1000);
                const totalMainLength = mainLengthPerBar * mainCount * quantity;
                const longitudinalBars = [{ dia: mainDia, count: mainCount, lengthPerBar: mainLengthPerBar, totalLength: totalMainLength, weight: totalMainLength * this.getUnitWeight(mainDia), position: 'Utama' }];
                const spacingM = spec.stirrupRebar.spacing / 1000;
                const stirrupCountPerUnit = this.countStations(spanLength, spacingM);
                const cover = 0.040;
                const b = spec.sectionType === 'RECTANGULAR' ? spec.width / 1000 : spec.webWidth / 1000;
                const h = spec.totalHeight ? spec.totalHeight / 1000 : spec.height / 1000;
                const d = spec.stirrupRebar.dia / 1000;
                const stirrupCutLength = Math.max(0, (2 * Math.max(0, b - 2 * cover)) + (2 * Math.max(0, h - 2 * cover)) + (2 * 10 * d));
                const totalLength = stirrupCutLength * stirrupCountPerUnit * quantity;
                const stirrupBars = [{ dia: spec.stirrupRebar.dia, count: stirrupCountPerUnit * quantity, cutLength: stirrupCutLength, totalLength, weight: totalLength * this.getUnitWeight(spec.stirrupRebar.dia), label: spec.stirrupRebar.label }];
                const mainWeight = longitudinalBars.reduce((sum, bar) => sum + bar.weight, 0);
                const stirrupWeight = stirrupBars.reduce((sum, bar) => sum + bar.weight, 0);
                const installedWeight = mainWeight + stirrupWeight;
                return {
                    mainDia, mainCount, totalMainLength: totalMainLength, mainWeight,
                    stirrupDia: spec.stirrupRebar.dia, totalStirrups: stirrupCountPerUnit * quantity,
                    totalStirrupLength: totalLength, stirrupWeight,
                    subtotalWeight: installedWeight, installedWeight,
                    procurementWeight: installedWeight * STANDARD_BASIS.rebarMaterialFactor,
                    bindingWireKg: installedWeight * STANDARD_BASIS.bindingWireFactorPerKgInstalled,
                    longitudinalBars, stirrupBars,
                    longitudinalLabel: spec.mainRebar.label,
                    stirrupLabel: spec.stirrupRebar.label
                };
            }
        };

        // 3. CONCRETE ENGINE
        const ConcreteEngine = {
            calculateMixComponents(concreteVolumeM3) {
                const cementKg = concreteVolumeM3 * 383;
                const sandKg = concreteVolumeM3 * 764;
                const gravelKg = concreteVolumeM3 * 934;
                const waterLiters = concreteVolumeM3 * 195;
                return {
                    cementKg,
                    cementBagsEquivalent: cementKg / 50,
                    cementBags: Math.ceil(cementKg / 50),
                    sandKg,
                    sandM3: sandKg / STANDARD_BASIS.sandLooseDensityKgM3,
                    gravelKg,
                    gravelM3: gravelKg / STANDARD_BASIS.gravelLooseDensityKgM3,
                    waterLiters,
                    ahspReference: STANDARD_BASIS.concrete
                };
            }
        };

        // 4. AHSP & PRICE ENGINE
        const AHSPEngine = {
            calculateRAB(typeKey, spanLength, quantity, prices, settings) {
                const concreteVol = GeometryEngine.calculateConcreteVolume(typeKey, spanLength, quantity);
                const formworkArea = GeometryEngine.calculateFormworkArea(typeKey, spanLength, quantity);
                const rebarDetails = RebarEngine.calculateRebarDetails(typeKey, spanLength, quantity);
                const mix = ConcreteEngine.calculateMixComponents(concreteVol);

                // HSD database: semen Rp/sak 50 kg; pasir & kerikil Rp/m3; besi & bendrat Rp/kg.
                const costCement = mix.cementBagsEquivalent * Number(prices.cement || 0);
                const costSand = mix.sandM3 * Number(prices.sand || 0);
                const costGravel = mix.gravelM3 * Number(prices.gravel || 0);

                const rebarPrice = (bar) => RebarEngine.getBarPricePerKg(bar.dia, prices);
                const costRebarMain = rebarDetails.longitudinalBars.reduce((sum, bar) => sum + (bar.weight * STANDARD_BASIS.rebarMaterialFactor * rebarPrice(bar)), 0);
                const costRebarStirrup = rebarDetails.stirrupBars.reduce((sum, bar) => sum + (bar.weight * STANDARD_BASIS.rebarMaterialFactor * rebarPrice(bar)), 0);
                const costWire = rebarDetails.bindingWireKg * Number(prices.bindingWire || 0);

                // Bekisting balok maksimal 2 kali pakai sesuai kebijakan estimator. Material reusable
                // dinormalisasi dari basis 3x menjadi 2x; consumable tetap mengikuti koefisien per m².
                const fw = STANDARD_BASIS.formwork;
                const formworkWoodM3 = formworkArea * fw.classIIBalokM3PerM2;
                const costFormworkWood = formworkWoodM3 * Number(prices.formworkWood || 0);
                const formworkNailsKg = formworkArea * fw.nailsKgPerM2;
                const formworkOilL = formworkArea * fw.releaseOilLPerM2;
                const formworkPlywoodSheet = formworkArea * fw.plywoodSheetPerM2;
                const formworkDolkenBar = formworkArea * fw.dolkenBarPerM2;
                const costFormworkNails = formworkNailsKg * Number(prices.formworkNails || 0);
                const costFormworkOil = formworkOilL * Number(prices.formworkOil || 0);
                const costFormworkPlywood = formworkPlywoodSheet * Number(prices.formworkPlywood || AUX_FORMWORK_PRICE_DEFAULTS.formworkPlywood);
                const costFormworkDolken = formworkDolkenBar * Number(prices.formworkDolken || AUX_FORMWORK_PRICE_DEFAULTS.formworkDolken);
                const totalFormworkMaterialCost = costFormworkWood + costFormworkNails + costFormworkOil + costFormworkPlywood + costFormworkDolken;

                const totalMaterialCost = costCement + costSand + costGravel + costRebarMain + costRebarStirrup + costWire + totalFormworkMaterialCost;

                // Beton U.4.2.b.1.2 sudah termasuk pembuatan s.d. pengecoran.
                // Kepala tukang digabung ke kelompok tukang batu karena database hanya punya satu harga artisan.
                const concreteWorkerOH = STANDARD_BASIS.concreteLabour.worker * concreteVol;
                const concreteArtisanOH = (STANDARD_BASIS.concreteLabour.artisan + STANDARD_BASIS.concreteLabour.head) * concreteVol;
                const concreteForemanOH = STANDARD_BASIS.concreteLabour.foreman * concreteVol;

                // Pemadatan vibrator adalah analisa terpisah U.4.5.b dan ditambahkan satu kali.
                const compactionWorkerOH = STANDARD_BASIS.concreteCompaction.worker * concreteVol;
                const compactionForemanOH = STANDARD_BASIS.concreteCompaction.foreman * concreteVol;
                const equipmentMixerDays = STANDARD_BASIS.concreteEquipment.mixerDayPerM3 * concreteVol;
                const costMixer = equipmentMixerDays * Number(prices.equipmentMixer || 0);
                const equipmentVibratorDays = STANDARD_BASIS.concreteCompaction.vibratorDay * concreteVol;
                const costVibrator = equipmentVibratorDays * Number(prices.equipmentVibrator || 0);

                // Penulangan balok <12 mm: U.4.6.a.3.
                // Jika kelak ada >=12 mm, gunakan koefisien U.4.6.a.4.
                const allRebarBars = [...rebarDetails.longitudinalBars, ...rebarDetails.stirrupBars];
                const rebarWorkerOH = allRebarBars.reduce((sum, bar) => {
                    const c = bar.dia >= 12 ? STANDARD_BASIS.rebarManualLarge : STANDARD_BASIS.rebarManualSmall;
                    return sum + bar.weight * c.worker;
                }, 0);
                const rebarArtisanOH = allRebarBars.reduce((sum, bar) => {
                    const c = bar.dia >= 12 ? STANDARD_BASIS.rebarManualLarge : STANDARD_BASIS.rebarManualSmall;
                    return sum + bar.weight * c.artisan;
                }, 0);
                const rebarHeadOH = allRebarBars.reduce((sum, bar) => {
                    const c = bar.dia >= 12 ? STANDARD_BASIS.rebarManualLarge : STANDARD_BASIS.rebarManualSmall;
                    return sum + bar.weight * c.head;
                }, 0);
                const rebarForemanOH = allRebarBars.reduce((sum, bar) => {
                    const c = bar.dia >= 12 ? STANDARD_BASIS.rebarManualLarge : STANDARD_BASIS.rebarManualSmall;
                    return sum + bar.weight * c.foreman;
                }, 0);
                const rebarLargeWeight = allRebarBars.reduce((sum, bar) => sum + (bar.dia >= 12 ? bar.weight : 0), 0);
                // AHSP U.4.6.a.4: diameter >= 12 mm uses semi-mechanical rebar work,
                // including 0.04 day/kg bar cutter + 0.04 day/kg bar bender.
                const equipmentBarCutterDays = rebarLargeWeight * 0.040;
                const equipmentBarBenderDays = rebarLargeWeight * 0.040;
                const costBarCutter = equipmentBarCutterDays * Number(prices.equipmentBarCutter || 0);
                const costBarBender = equipmentBarBenderDays * Number(prices.equipmentBarBender || 0);

                // Bekisting balok maksimal 2 kali pakai; koefisien tenaga kerja tetap 0.66/0.33/0.033/0.011 OH per m².
                // Tukang kayu + kepala tukang diproksikan ke field artisan karena database belum punya harga tukang kayu.
                const formworkWorkerOH = fw.worker * formworkArea;
                const formworkArtisanOH = (fw.carpenter + fw.headCarpenter) * formworkArea;
                const formworkForemanOH = fw.foreman * formworkArea;

                const totalWorkerOH = concreteWorkerOH + compactionWorkerOH + rebarWorkerOH + formworkWorkerOH;
                const totalArtisanOH = concreteArtisanOH + rebarArtisanOH + rebarHeadOH + formworkArtisanOH;
                const totalForemanOH = concreteForemanOH + compactionForemanOH + rebarForemanOH + formworkForemanOH;

                const costWorker = totalWorkerOH * Number(prices.labourWorker || 0);
                const costArtisan = totalArtisanOH * Number(prices.labourArtisan || 0);
                const costForeman = totalForemanOH * Number(prices.labourForeman || 0);
                const totalLabourCost = costWorker + costArtisan + costForeman;
                const totalEquipmentCost = costMixer + costVibrator + costBarCutter + costBarBender;
                const subtotalDirect = totalMaterialCost + totalLabourCost + totalEquipmentCost;

                const overheadVal = subtotalDirect * (settings.overheadPct / 100);
                const profitVal = subtotalDirect * (settings.profitPct / 100);
                const subtotalBeforeTax = subtotalDirect + overheadVal + profitVal;
                const pphVal = subtotalBeforeTax * (settings.pphPct / 100);
                const ppnVal = subtotalBeforeTax * (settings.ppnPct / 100);
                const grandTotal = subtotalBeforeTax + pphVal + ppnVal;

                // Benchmark harga 1 m³ beton cor: hanya komponen beton + pengecoran/pemadatan,
                // tidak termasuk tulangan dan bekisting. Air dianggap gratis sesuai kebijakan database.
                const concreteMaterialUnitCost = (383 / 50) * Number(prices.cement || 0)
                    + (764 / STANDARD_BASIS.sandLooseDensityKgM3) * Number(prices.sand || 0)
                    + (934 / STANDARD_BASIS.gravelLooseDensityKgM3) * Number(prices.gravel || 0);
                const concreteLabourUnitCost = (STANDARD_BASIS.concreteLabour.worker * Number(prices.labourWorker || 0))
                    + ((STANDARD_BASIS.concreteLabour.artisan + STANDARD_BASIS.concreteLabour.head) * Number(prices.labourArtisan || 0))
                    + (STANDARD_BASIS.concreteLabour.foreman * Number(prices.labourForeman || 0))
                    + (STANDARD_BASIS.concreteCompaction.worker * Number(prices.labourWorker || 0))
                    + (STANDARD_BASIS.concreteCompaction.foreman * Number(prices.labourForeman || 0));
                const concreteEquipmentUnitCost = STANDARD_BASIS.concreteEquipment.mixerDayPerM3 * Number(prices.equipmentMixer || 0)
                    + STANDARD_BASIS.concreteCompaction.vibratorDay * Number(prices.equipmentVibrator || 0);
                const concreteUnitDirectCost = concreteMaterialUnitCost + concreteLabourUnitCost + concreteEquipmentUnitCost;
                const costPerUnit = grandTotal / quantity;
                const costPerMeter = grandTotal / (spanLength * quantity);
                const estimatedDays = Math.max(1, Math.ceil((totalWorkerOH + totalArtisanOH) / 5));

                return {
                    concreteVol,
                    formworkArea,
                    rebarDetails,
                    mix,
                    formwork: { formworkWoodM3, formworkNailsKg, formworkOilL, formworkPlywoodSheet, formworkDolkenBar },

                        formworkPlywood: costFormworkPlywood, formworkDolken: costFormworkDolken,
                        totalFormworkMaterialCost, totalMaterialCost,
                        equipmentMixer: costMixer, equipmentVibrator: costVibrator, equipmentBarCutter: costBarCutter, equipmentBarBender: costBarBender, totalEquipmentCost,

                        grandTotal, costPerUnit, costPerMeter,
                        concreteUnit: { material: concreteMaterialUnitCost, labour: concreteLabourUnitCost, equipment: concreteEquipmentUnitCost, directCost: concreteUnitDirectCost }
                    },

                    standard: STANDARD_BASIS

        // --- FULL FORMAL REPORT PRINT/PDF MODAL ---
        const ReportModal = ({ isOpen, onClose, project, selectedType, selectedSpan, quantity, currentRAB, prices, rabSettings }) => {

                // Render a clean, fixed-width A4 clone. The on-screen modal has
                // viewport/scroll/flex constraints that are unsuitable for html2canvas.
                // Keep the export clone inside the viewport. A huge negative left
                // offset can make html2canvas calculate a wrong canvas origin and crop
                // the left side of the generated PDF.
                const host = document.createElement('div');
                host.id = 'pdf-export-host';
                host.style.cssText = 'position:fixed;left:0;top:0;width:190mm;min-height:297mm;background:#fff;overflow:visible;z-index:2147483647;opacity:0.01;pointer-events:none;box-sizing:border-box;';
                const clone = original.cloneNode(true);
                clone.removeAttribute('id');

                clone.querySelectorAll('.no-print').forEach(el => el.remove());
                host.appendChild(clone);
                document.body.appendChild(host);

                // html2canvas does not honor @media print. Force the technical
                // drawing to remain white with visible black linework in export.
                clone.querySelectorAll('.structural-drawing-print-safe').forEach(el => {
                    el.style.background = '#fff';
                    el.style.color = '#111827';

                clone.querySelectorAll('.drawing-grid').forEach(el => el.setAttribute('stroke','#d1d5db'));
                clone.querySelectorAll('.drawing-dimension').forEach(el => el.setAttribute('stroke','#374151'));
                clone.querySelectorAll('.drawing-label').forEach(el => el.setAttribute('fill','#111827'));

                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

                const opt = {
                    margin: [10,10,10,10],
                    filename: `Laporan_Komplit_RAB_TitiPanen_${project.regency}_${spec.code}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        width: Math.ceil(190/25.4*96),
                        windowWidth: Math.ceil(190/25.4*96),

                        y: 0,
                        scrollX: 0,
                        scrollY: 0
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
                    pagebreak: { mode: ['css','legacy'], avoid: ['tr','td','.pdf-no-break'] }
                };

                try {
                    await window.html2pdf().set(opt).from(clone).save();
                } catch (err) {
                    console.error('Gagal membuat PDF:', err);
                    window.print();
                } finally {
                    host.remove();
                }

                <div id="report-print-overlay" className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-md p-2 sm:p-4 overflow-y-auto">
                    <div id="report-print-card" className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-4xl w-full border border-slate-200 dark:border-slate-800 my-auto overflow-hidden">

        const normalizeLegacyRegionalPrices = (source) => {
            const copy = JSON.parse(JSON.stringify(source || {}));
            Object.values(copy).forEach(provinceMap => Object.values(provinceMap || {}).forEach(regencyMap => {
                Object.values(regencyMap || {}).forEach(price => {
                    [6, 8, 10, 12].forEach(d => {
                        const legacyBarPrice = Number(price[`rebar${d}`]);
                        const unitWeight12m = 0.006165 * Math.pow(d, 2) * 12;
                        if (legacyBarPrice > 0 && unitWeight12m > 0) {
                            price[`rebar${d}`] = legacyBarPrice / unitWeight12m;
                        }
                    });
                });
            }));
            return copy;
        };

        const App = () => {
            const [darkMode, setDarkMode] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('dashboard'); 

            // Project State
            const [project, setProject] = React.useState(DEFAULT_PROJECT);
            const [selectedType, setSelectedType] = React.useState('TP01');
            const [selectedSpan, setSelectedSpan] = React.useState(4);
            const [quantity, setQuantity] = React.useState(1);

            // Dynamic Regional Price Database with LocalStorage persistence
            const [regionalDb, setRegionalDb] = React.useState(() => {
                const saved = localStorage.getItem('titi_panen_regional_db');
                return saved ? normalizeLegacyRegionalPrices(JSON.parse(saved)) : normalizeLegacyRegionalPrices(REGIONAL_DATABASE);
            });

            // Prices for active selected regency
            const [prices, setPrices] = React.useState(() => {
                return {
                    ...completePrices(regionalDb["Sumatera"]["Riau"]["Rokan Hulu"], COMPLETE_PRICE_DEFAULTS),
                    ...completeAuxiliaryPrices({})
                };
            });

            const [rabSettings, setRabSettings] = React.useState({
                overheadPct: 5.0,
                profitPct: 10.0,
                pphPct: 4.0,
                ppnPct: 0.0
            });

            const [wizardStep, setWizardStep] = React.useState(1);
            const [isReportOpen, setIsReportOpen] = React.useState(false);

            const [history, setHistory] = React.useState(() => {
                const saved = localStorage.getItem('titi_panen_estimations');
                return saved ? JSON.parse(saved) : [];
            });

            const [explainData, setExplainData] = React.useState(null);
            const [toast, setToast] = React.useState(null);

            // Central estimator database / AI market intelligence
            const getLocalLocations = () => {
                const provinces = {};
                const provinceList = [];
                Object.entries(REGIONAL_DATABASE || {}).forEach(([island, provinceMap]) => {
                    Object.entries(provinceMap || {}).forEach(([province, regencyMap]) => {
                        if (!provinceList.includes(province)) provinceList.push(province);
                        provinces[province] = Object.keys(regencyMap || {});
                    });
                });
                return { provinces, provinceList };
            };

            const [centralLocations, setCentralLocations] = React.useState(() => ({
                provinces: {},
                provinceList: []
            }));
            const [ptByRegency, setPtByRegency] = React.useState(() => normalizePTDatabase(PT_DATABASE));
            const [estimatorByPT, setEstimatorByPT] = React.useState(() => ({ ...ESTIMATOR_BY_PT }));
            const [centralLoading, setCentralLoading] = React.useState(false);
            const [centralPriceSource, setCentralPriceSource] = React.useState('ESTIMATOR DATABASE');
            const [marketItem, setMarketItem] = React.useState('Cement');
            const [marketAnalysis, setMarketAnalysis] = React.useState(null);
            const [marketLoading, setMarketLoading] = React.useState(false);
            // Analisa ulang & perbandingan PT
            const [compareRows, setCompareRows] = React.useState([]);
            const [compareLoading, setCompareLoading] = React.useState(false);
            const [compareScope, setCompareScope] = React.useState('all');
            const [compareType, setCompareType] = React.useState(selectedType);
            const [compareSpan, setCompareSpan] = React.useState(selectedSpan);
            const [compareQty, setCompareQty] = React.useState(quantity);
            const [compareSort, setCompareSort] = React.useState('priceAsc');
            const [simRows, setSimRows] = React.useState([]);
            const [simLoading, setSimLoading] = React.useState(false);
            const [simType, setSimType] = React.useState(selectedType);
            const [simSpan, setSimSpan] = React.useState(selectedSpan);
            const [simQty, setSimQty] = React.useState(quantity);
            const [simSort, setSimSort] = React.useState('priceAsc');

            const provinceIsland = (province) => {
                if (province === 'Riau' || province === 'Jambi') return 'Sumatera';
                if (province && province.startsWith('Kalimantan')) return 'Kalimantan';
                if (province && province.startsWith('Sulawesi')) return 'Sulawesi';
                return 'Sumatera';
            };

            // Group all provinces returned by the central database by island,
            // so the Pulau dropdown can actually be selected (previously hardcoded to 1 option).
            const islandProvinceMap = React.useMemo(() => {
                const map = {};
                (centralLocations.provinceList || []).forEach(prov => {
                    const isl = provinceIsland(prov);
                    if (!map[isl]) map[isl] = [];
                    map[isl].push(prov);
                });
                return map;
            }, [centralLocations.provinceList]);

            const islandList = React.useMemo(() => {
                return Object.keys(islandProvinceMap).sort();
            }, [islandProvinceMap]);

            const priceKeyMap = {
                Cement: 'cement', Sand: 'sand', Gravel: 'gravel',
                Rebar6: 'rebar6', Rebar8: 'rebar8', Rebar10: 'rebar10', Rebar12: 'rebar12',
                BindingWire: 'bindingWire', FormworkWood: 'formworkWood',
                FormworkNails: 'formworkNails', FormworkOil: 'formworkOil', FormworkPlywood: 'formworkPlywood', FormworkDolken: 'formworkDolken',
                EquipmentMixer: 'equipmentMixer', EquipmentVibrator: 'equipmentVibrator', EquipmentBarCutter: 'equipmentBarCutter', EquipmentBarBender: 'equipmentBarBender',
                LabourWorker: 'labourWorker', LabourArtisan: 'labourArtisan', LabourForeman: 'labourForeman'
            };

            const normalizeCentralPrices = (apiPrices) => {
                const normalized = {};
                Object.entries(apiPrices || {}).forEach(([item, data]) => {
                    const key = priceKeyMap[item] || item.charAt(0).toLowerCase() + item.slice(1);
                    const rawPrice = (data && typeof data === 'object') ? data.price : data;
                    const value = Number(rawPrice);
                    if (Number.isFinite(value) && value > 0) normalized[key] = value;
                });
                return normalized;
            };

            // Fetch bridge for Apps Script Web App.
            // Uses plain fetch() first (Apps Script Content Service supports CORS for GET).
            // Falls back to the old JSONP <script> trick only if fetch itself fails to reach the network
            // (e.g. very old browser). Note: JSONP can be blocked by Chrome's ORB feature when the
            // redirect chain's final Content-Type isn't recognised as a script, so fetch is the primary path.
            const callEstimatorApiViaFetch = async (params = {}, timeoutMs = 15000) => {
                const query = new URLSearchParams({ ...params, _: Date.now().toString() });
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const response = await fetch(ESTIMATOR_API_URL + '?' + query.toString(), {
                        method: 'GET',
                        signal: controller.signal
                    });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return await response.json();
                } finally {
                    clearTimeout(timer);
                }
            };

            const callEstimatorApiViaJsonp = (params = {}, timeoutMs = 15000) => new Promise((resolve, reject) => {
                const callbackName = '__estimator_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
                const script = document.createElement('script');
                const query = new URLSearchParams({ ...params, callback: callbackName, _: Date.now().toString() });
                const cleanup = () => {
                    try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                };
                const timer = setTimeout(() => { cleanup(); reject(new Error('Database pusat timeout.')); }, timeoutMs);
                window[callbackName] = (data) => { clearTimeout(timer); cleanup(); resolve(data); };
                script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error('Database pusat sedang tidak tersedia.')); };
                script.src = ESTIMATOR_API_URL + '?' + query.toString();
                document.body.appendChild(script);
            });

            // action=market runs live web search + page scraping + a Gemini call on the backend,
            // which routinely takes well over 15s - give it a much longer budget than simple lookups.
            const callEstimatorApi = async (params = {}) => {
                const timeoutMs = params.action === 'market' ? 90000 : 15000;

                // Apps Script Web App: JSONP menjadi jalur utama untuk lookup
                // lokasi/harga karena endpoint Code.gs memang mendukung callback.
                // Fetch tetap menjadi fallback.
                try {
                    return await callEstimatorApiViaJsonp(params, timeoutMs);
                } catch (jsonpError) {
                    console.warn('JSONP database gagal, mencoba Fetch:', jsonpError);
                    return await callEstimatorApiViaFetch(params, timeoutMs);
                }
            };

            const fetchCentralLocations = async () => {
                setCentralLoading(true);
                try {
                    const data = await callEstimatorApi({ action: 'locations', estimator: 'Titi Panen' });
                    if (!data.success) throw new Error(data.error || 'Gagal mengambil lokasi.');
                    setCentralLocations({ provinces: data.provinces || data.locations || {}, provinceList: data.provinceList || [] });
                    const apiPT = data.ptByRegency || data.companies || data.pt || null;
                    if (apiPT && typeof apiPT === 'object') {
                        setPtByRegency(prev => ({ ...prev, ...normalizePTDatabase(apiPT) }));
                    }

                    // Nama IFM ANALYST diambil LANGSUNG dari kolom ESTIMATOR
                    // pada sheet PT, berdasarkan kode PT yang dipilih.
                    if (data.estimatorByPT && typeof data.estimatorByPT === 'object') {
                        setEstimatorByPT(prev => ({ ...prev, ...data.estimatorByPT }));
                        Object.assign(ESTIMATOR_BY_PT_RUNTIME, data.estimatorByPT);
                    }

                    setCentralPriceSource('ESTIMATOR DATABASE');

                    const provinces = data.provinceList || [];
                    if (provinces.length) {
                        const province = provinces.includes(project.province) ? project.province : provinces[0];
                        const regencies = data.provinces[province] || [];
                        const regency = regencies.includes(project.regency) ? project.regency : regencies[0];
                        setProject(prev => ({ ...prev, island: provinceIsland(province), province, regency }));
                        if (regency) await fetchCentralPrices(province, regency);
                    }
                } catch (error) {
                    console.error('Central location error:', error);
                    setCentralPriceSource('LOCAL FALLBACK');
                } finally {
                    setCentralLoading(false);
                }
            };

            const priceRequestRef = React.useRef(0);

            const fetchCentralPrices = async (province, regency) => {
                const requestId = ++priceRequestRef.current;
                const targetProvince = String(province || '').trim();
                const targetRegency = String(regency || '').trim();

                if (!targetProvince || !targetRegency) return false;

                try {
                    const data = await callEstimatorApi({
                        action: 'prices',
                        estimator: 'Titi Panen',
                        province: targetProvince,
                        regency: targetRegency,
                        _: Date.now()
                    });

                    // Abaikan response lama jika user sudah memilih kabupaten lain.
                    if (requestId !== priceRequestRef.current) return false;

                    if (!data || data.success !== true || !data.prices || Number(data.count) <= 0) {
                        throw new Error(
                            (data && data.error) ||
                            `Harga ESTIMATOR tidak ditemukan untuk ${targetRegency}, ${targetProvince}.`
                        );
                    }

                    const normalized = normalizeCentralPrices(data.prices);
                    const localFallback = getLocalPrices(targetProvince, targetRegency) || {};
                    const merged = {
                        ...completePrices(normalized, { ...localFallback, ...COMPLETE_PRICE_DEFAULTS }),
                        ...completeAuxiliaryPrices({ ...localFallback, ...normalized })
                    };

                    // Harga ESTIMATOR pusat menjadi prioritas. Item yang tidak tersedia
                    // dilengkapi dari fallback agar 18 field selalu terisi.
                    setPrices(merged);
                    setCentralPriceSource(
                        `ESTIMATOR • ${targetRegency}`
                    );
                    setMarketAnalysis(null);

                    const firstItem = Object.keys(data.prices)[0];
                    if (firstItem) {
                        setMarketItem(
                            priceKeyMap[firstItem] ||
                            firstItem.charAt(0).toLowerCase() + firstItem.slice(1)
                        );
                    }

                    return true;

                } catch (error) {
                    if (requestId !== priceRequestRef.current) return false;

                    console.error(
                        `Gagal mengambil harga ESTIMATOR untuk ${targetRegency}, ${targetProvince}:`,
                        error
                    );

                    // JANGAN mempertahankan harga kabupaten sebelumnya.
                    // Ini penting agar misalnya Aceh Barat tidak memakai harga
                    // Rokan Hulu hanya karena request baru gagal.
                    const localFallback = getLocalPrices(targetProvince, targetRegency) || {};
                    setPrices({
                        ...completePrices(localFallback, COMPLETE_PRICE_DEFAULTS),
                        ...completeAuxiliaryPrices(localFallback)
                    });

                    setCentralPriceSource(`ERROR HARGA • ${targetRegency}`);
                    return false;
                }
            };

            // Sinkronisasi database pusat saat aplikasi dibuka.
            // Render awal tetap memakai fallback lokal, lalu ESTIMATOR menggantikan
            // daftar lokasi + PT + harga ketika koneksi berhasil.
            React.useEffect(() => {
                fetchCentralLocations();
            }, []);

            const analyzeMarketItem = async () => {
                const itemName = Object.keys(priceKeyMap).find(k => priceKeyMap[k] === marketItem) || marketItem;
                setMarketLoading(true);
                setMarketAnalysis(null);
                try {
                    const data = await callEstimatorApi({
                        action: 'market',
                        estimator: 'Titi Panen',
                        province: project.province,
                        regency: project.regency,
                        item: itemName
                    });
                    if (!data.success) throw new Error(data.error || 'Analisis market gagal.');
                    setMarketAnalysis(data);
                    showToast(`Analisis harga ${itemName} selesai.`);
                } catch (error) {
                    console.error('Market analysis error:', error);
                    showToast('Analisis harga gagal: ' + error.message, 'error');
                } finally {
                    setMarketLoading(false);
                }
            };

            const applyRecommendedPrice = () => {
                const recommended = Number(marketAnalysis?.analysis?.recommendedPrice) || 0;
                if (!recommended) return;
                setPrices(prev => ({ ...prev, [marketItem]: recommended }));
                showToast('Harga rekomendasi AI diterapkan ke RAB. Belum mengubah Sheet ESTIMATOR.');
            };


            // Mulai analisa baru tanpa perlu refresh halaman.
            const startNewAnalysis = () => {
                setWizardStep(1);
                setActiveTab('wizard');
                setCompareRows([]);
                setCompareType(selectedType);
                setCompareSpan(selectedSpan);
                setCompareQty(quantity);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Ambil daftar PT + kabupaten dari database PT.
            const getAllPTRecords = () => {
                const records = [];
                Object.entries(ptByRegency || {}).forEach(([regency, pts]) => {
                    (pts || []).forEach(pt => {
                        records.push({
                            pt: String(pt).trim(),
                            regency: String(regency).trim(),
                            estimator: getEstimatorByPT(pt)
                        });
                    });
                });
                return records.filter((r, i, arr) =>
                    r.pt && arr.findIndex(x => x.pt === r.pt) === i
                );
            };

            const getCompareRecords = () => {
                const all = getAllPTRecords();
                if (compareScope === 'regency') {
                    return all.filter(x => x.regency === project.regency);
                }
                if (compareScope === 'province') {
                    const regencies = centralLocations.provinces[project.province] || [];
                    return all.filter(x => regencies.includes(x.regency));
                }
                return all;
            };

            // Bandingkan PT menggunakan spesifikasi yang SAMA.
            // Harga setiap PT diambil berdasarkan KABUPATEN PT tersebut.
            const runPTComparison = async () => {
                const records = getCompareRecords();

                if (!records.length) {
                    showToast('Belum ada data PT untuk dibandingkan.', 'error');
                    return;
                }

                const typeSpec = TITI_PANEN_TYPES[compareType];
                if (!typeSpec || !typeSpec.spans.includes(Number(compareSpan))) {
                    showToast('Bentang tidak sesuai dengan tipe titi panen.', 'error');
                    return;
                }

                setCompareLoading(true);
                setCompareRows([]);

                try {
                    // Hindari request berulang untuk kabupaten yang sama.
                    const uniqueRegencies = [...new Set(records.map(r => r.regency))];
                    const priceMap = {};

                    for (const regency of uniqueRegencies) {
                        const record = await callEstimatorApi({
                            action: 'prices',
                            estimator: 'Titi Panen',
                            province: (() => {
                                const p = Object.keys(centralLocations.provinces || {})
                                    .find(prov => (centralLocations.provinces[prov] || []).includes(regency));
                                return p || project.province;
                            })(),
                            regency
                        });

                        if (record && record.success && record.prices && Number(record.count) > 0) {
                            priceMap[regency] = normalizeCentralPrices(record.prices);
                        }
                    }

                    const rows = records.map(r => {
                        const p = priceMap[r.regency];
                        if (!p) {
                            return {
                                ...r,
                                available: false,
                                grandTotal: 0,
                                costPerUnit: 0,
                                costPerMeter: 0
                            };
                        }

                        const rab = AHSPEngine.calculateRAB(
                            compareType,
                            Number(compareSpan),
                            Number(compareQty),
                            p,
                            rabSettings
                        );

                        return {
                            ...r,
                            available: true,
                            grandTotal: rab.costs.grandTotal,
                            costPerUnit: rab.costs.costPerUnit,
                            costPerMeter: rab.costs.costPerMeter,
                            materialCost: rab.costs.totalMaterialCost,
                            labourCost: rab.costs.totalLabourCost
                        };
                    });

                    setCompareRows(rows);
                    showToast(`Perbandingan ${rows.length} PT selesai.`);
                } catch (error) {
                    console.error('PT comparison error:', error);
                    showToast('Perbandingan PT gagal: ' + error.message, 'error');
                } finally {
                    setCompareLoading(false);
                }
            };


            const runAllRegencySimulation = async () => {
                const locations = centralLocations?.provinces || {};
                const records = [];
                Object.entries(locations).forEach(([province, regencies]) => {
                    (regencies || []).forEach(regency => {
                        records.push({ province: String(province).trim(), regency: String(regency).trim() });
                    });
                });

                if (!records.length) {
                    showToast('Database ESTIMATOR belum memiliki data kabupaten.', 'error');
                    return;
                }

                const spec = TITI_PANEN_TYPES[simType];
                if (!spec || !spec.spans.includes(Number(simSpan))) {
                    showToast('Bentang tidak sesuai dengan tipe titi panen.', 'error');
                    return;
                }

                setSimLoading(true);
                setSimRows([]);

                try {
                    const rows = [];
                    for (const loc of records) {
                        try {
                            const data = await callEstimatorApi({
                                action: 'prices',
                                estimator: 'Titi Panen',
                                province: loc.province,
                                regency: loc.regency,
                                _: Date.now()
                            });

                            if (!data || data.success !== true || !data.prices || Number(data.count) <= 0) {
                                rows.push({...loc, available:false, grandTotal:0, materialCost:0, labourCost:0, costPerUnit:0, costPerMeter:0});
                                continue;
                            }

                            const pricesForRegency = normalizeCentralPrices(data.prices);
                            const rab = AHSPEngine.calculateRAB(
                                simType, Number(simSpan), Number(simQty),
                                pricesForRegency, rabSettings
                            );

                            rows.push({
                                ...loc,
                                available: true,
                                grandTotal: Number(rab.costs.grandTotal) || 0,
                                materialCost: Number(rab.costs.totalMaterialCost) || 0,
                                labourCost: Number(rab.costs.totalLabourCost) || 0,
                                costPerUnit: Number(rab.costs.costPerUnit) || 0,
                                costPerMeter: Number(rab.costs.costPerMeter) || 0
                            });
                        } catch (err) {
                            rows.push({...loc, available:false, grandTotal:0, materialCost:0, labourCost:0, costPerUnit:0, costPerMeter:0});
                        }
                    }

                    setSimRows(rows);
                    showToast(`Simulasi ${rows.length} kabupaten selesai.`);
                } catch (error) {
                    console.error(error);
                    showToast('Simulasi gagal: ' + error.message, 'error');
                } finally {
                    setSimLoading(false);
                }
            };

            const sortedSimRows = React.useMemo(() => {
                const rows = [...simRows];
                if (simSort === 'priceAsc') return rows.sort((a,b) => (a.available ? a.grandTotal : Infinity) - (b.available ? b.grandTotal : Infinity));
                if (simSort === 'priceDesc') return rows.sort((a,b) => (b.available ? b.grandTotal : -Infinity) - (a.available ? a.grandTotal : -Infinity));
                return rows.sort((a,b) => `${a.province} ${a.regency}`.localeCompare(`${b.province} ${b.regency}`));
            }, [simRows, simSort]);

            const sortedCompareRows = React.useMemo(() => {
                const rows = [...compareRows];
                if (compareSort === 'priceAsc') {
                    return rows.sort((a, b) => (a.available ? a.grandTotal : Infinity) - (b.available ? b.grandTotal : Infinity));
                }
                if (compareSort === 'priceDesc') {
                    return rows.sort((a, b) => (b.available ? b.grandTotal : -Infinity) - (a.available ? a.grandTotal : -Infinity));
                }
                return rows.sort((a, b) => a.pt.localeCompare(b.pt));

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);

            const getPTOptions = (regency) => ptByRegency[regency] || [];

            const selectDefaultPT = (regency, currentCompany = '') => {
                const options = getPTOptions(regency);

                return options.includes(currentCompany) ? currentCompany : options[0];
            };

            const getLocalPrices = (province, regency) => {
                const raw = REGIONAL_DATABASE?.[provinceIsland(province)]?.[province]?.[regency] || {};
                const normalized = { ...raw };
                [6, 8, 10, 12].forEach(d => {
                    const legacyBarPrice = Number(normalized[`rebar${d}`]);
                    const unitWeight12m = 0.006165 * Math.pow(d, 2) * 12;
                    if (legacyBarPrice > 0 && unitWeight12m > 0) normalized[`rebar${d}`] = legacyBarPrice / unitWeight12m;
                });
                return {
                    ...completePrices(normalized, COMPLETE_PRICE_DEFAULTS),
                    ...completeAuxiliaryPrices(normalized)
                };
            };

            // Update location from the CENTRAL ESTIMATOR database.
            // Jika database pusat gagal, gunakan harga lokal sesuai Kabupaten.
            const handleLocationChange = async (newIsland, newProvince, newRegency) => {
                let updatedProvince = newProvince;

                    // Province wasn't changed directly (e.g. user changed Pulau instead) -
                    // keep current province if it still belongs to the chosen island, otherwise pick the island's first province.
                    const targetIsland = newIsland || project.island;
                    const provincesForIsland = islandProvinceMap[targetIsland] || [];
                    updatedProvince = provincesForIsland.includes(project.province) ? project.province : (provincesForIsland[0] || project.province);
                }

                const updatedIsland = provinceIsland(updatedProvince);
                const availableRegencies = centralLocations.provinces[updatedProvince] || [];
                const updatedRegency = newRegency || (availableRegencies.includes(project.regency) ? project.regency : availableRegencies[0]);

                const defaultPT = selectDefaultPT(updatedRegency || '', project.company);
                setProject(prev => ({
                    ...prev,
                    island: updatedIsland,
                    province: updatedProvince,
                    regency: updatedRegency || '',
                    company: defaultPT || prev.company
                }));

                if (updatedRegency) {
                    await fetchCentralPrices(updatedProvince, updatedRegency);
                }
            };

            // Save local edits only as a temporary browser fallback.
            // Central ESTIMATOR remains the authoritative database.
            const handleUpdateMarketPrice = async () => {
                const priceMapToItem = {
                    cement: 'Cement', sand: 'Sand', gravel: 'Gravel',
                    rebar6: 'Rebar6', rebar8: 'Rebar8', rebar10: 'Rebar10', rebar12: 'Rebar12',
                    bindingWire: 'BindingWire', formworkWood: 'FormworkWood',
                    formworkNails: 'FormworkNails', formworkOil: 'FormworkOil',
                    labourWorker: 'LabourWorker', labourArtisan: 'LabourArtisan', labourForeman: 'LabourForeman',
                    equipmentMixer: 'EquipmentMixer', equipmentVibrator: 'EquipmentVibrator',
                    equipmentBarCutter: 'EquipmentBarCutter', equipmentBarBender: 'EquipmentBarBender'
                };
                const items = Object.entries(priceMapToItem)
                    .filter(([key]) => Number.isFinite(Number(prices[key])) && Number(prices[key]) > 0);

                if (!project.province || !project.regency || !items.length) {
                    showToast('Lokasi atau harga belum lengkap.', 'error');
                    return;
                }

                try {
                    setCentralLoading(true);

                    let successCount = 0;

                    for (const [key, item] of items) {
                        const data = await callEstimatorApi({
                            action: 'update_price',
                            estimator: 'Titi Panen',
                            province: project.province,
                            regency: project.regency,
                            item,
                            price: Number(prices[key]),
                            unit: PRICE_DB_UNITS[key] || AUX_PRICE_UNITS[key] || ''
                        });

                        if (!data || data.success !== true) {
                            throw new Error(
                                (data && data.error) ||
                                `Gagal menyimpan ${item}`
                            );
                        }

                        successCount++;
                    }

                    // Ambil ulang dari database supaya nilai layar benar-benar
                    // sama dengan yang tersimpan di ESTIMATOR.
                    await fetchCentralPrices(project.province, project.regency);

                    showToast(
                        `${successCount} harga ${project.regency} berhasil disimpan ke ESTIMATOR.`
                    );

                } catch (error) {
                    console.error('Update ESTIMATOR gagal:', error);
                    showToast('Gagal menyimpan ke database: ' + error.message, 'error');
                } finally {
                    setCentralLoading(false);
                }
            };

            const currentRAB = React.useMemo(() => {
                return AHSPEngine.calculateRAB(selectedType, selectedSpan, quantity, completePrices(prices, COMPLETE_PRICE_DEFAULTS), rabSettings);
            }, [selectedType, selectedSpan, quantity, prices, rabSettings]);

                                            Enterprise

                                </div>

                                </div>
